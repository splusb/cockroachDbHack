<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Incident Memory Agent</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1117;
      color: #e4e4e7;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      padding: 16px 24px;
      border-bottom: 1px solid #27272a;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header .logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
    }

    .header .status {
      margin-left: auto;
      font-size: 12px;
      color: #71717a;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header .nav {
      display: flex;
      gap: 4px;
      margin-left: 24px;
    }

    .header .nav-link {
      color: #71717a;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
    }

    .header .nav-link:hover { color: #e4e4e7; background: #1c1c22; }
    .header .nav-link.active { color: #e4e4e7; background: #27272a; }

    .header .status .dot {
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
    }

    /* Chat area */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      display: flex;
      justify-content: flex-end;
    }

    .message.user .bubble {
      background: #6366f1;
      color: white;
      border-radius: 16px 16px 4px 16px;
      padding: 12px 16px;
      max-width: 80%;
    }

    .message.agent .bubble {
      background: #1c1c22;
      border: 1px solid #27272a;
      border-radius: 16px 16px 16px 4px;
      padding: 16px 20px;
      max-width: 100%;
    }

    .message.agent .label {
      font-size: 11px;
      color: #71717a;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Diagnosis card */
    .diagnosis {
      margin-top: 12px;
    }

    .diagnosis .section {
      margin-bottom: 12px;
    }

    .diagnosis .section-title {
      font-size: 11px;
      color: #a1a1aa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .diagnosis .section-content {
      font-size: 14px;
      line-height: 1.5;
    }

    .confidence-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .confidence-high { background: #052e16; color: #4ade80; }
    .confidence-medium { background: #422006; color: #fb923c; }
    .confidence-low { background: #450a0a; color: #f87171; }

    /* Similar incidents */
    .similar-list {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .similar-item {
      background: #0f0f14;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
    }

    .similar-item .sim-service {
      color: #8b5cf6;
      font-weight: 500;
      font-size: 11px;
      text-transform: uppercase;
    }

    .similar-item .sim-symptoms {
      color: #a1a1aa;
      margin-top: 2px;
    }

    .similar-item .sim-fix {
      color: #4ade80;
      margin-top: 4px;
      font-size: 12px;
    }

    .similar-item .sim-distance {
      color: #52525b;
      font-size: 11px;
      margin-top: 4px;
    }

    /* Loading */
    .loading {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #71717a;
      font-size: 14px;
    }

    .loading .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #27272a;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Input area */
    .input-area {
      padding: 16px 24px;
      border-top: 1px solid #27272a;
      background: #0f1117;
    }

    .input-wrapper {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    .input-row select {
      background: #1c1c22;
      border: 1px solid #27272a;
      color: #e4e4e7;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      min-width: 160px;
    }

    .input-row input {
      flex: 1;
      background: #1c1c22;
      border: 1px solid #27272a;
      color: #e4e4e7;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    .input-row input:focus {
      border-color: #6366f1;
    }

    .input-row button {
      background: #6366f1;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .input-row button:hover { background: #4f46e5; }
    .input-row button:disabled { background: #27272a; cursor: not-allowed; }

    /* Welcome */
    .welcome {
      text-align: center;
      color: #52525b;
      margin: auto;
      padding: 40px;
    }

    .welcome h2 {
      font-size: 20px;
      color: #71717a;
      margin-bottom: 8px;
    }

    .welcome p {
      font-size: 14px;
      max-width: 400px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* Memory badge */
    .memory-badge {
      margin-top: 12px;
      font-size: 11px;
      color: #52525b;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .memory-badge.updated { color: #4ade80; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🧠</div>
    <h1>Incident Memory Agent</h1>
    <nav class="nav">
      <a href="/" class="nav-link active">Investigate</a>
      <a href="/history" class="nav-link">History</a>
    </nav>
    <div class="status">
      <div class="dot"></div>
      <span>Connected</span>
    </div>
  </div>

  <div class="chat-container" id="chat">
    <div class="welcome">
      <h2>Incident Memory Agent</h2>
      <p>Describe an incident and I'll search my memory for similar past issues, diagnose the root cause, and propose a fix.</p>
    </div>
  </div>

  <div class="input-area">
    <div class="input-wrapper">
      <div class="input-row">
        <select id="service">
          <option value="auth-service">auth-service</option>
          <option value="payments-api">payments-api</option>
          <option value="search-indexer">search-indexer</option>
          <option value="notification-worker">notification-worker</option>
          <option value="api-gateway">api-gateway</option>
        </select>
        <input type="text" id="symptoms" placeholder="Describe the symptoms..." />
        <button id="send-btn" onclick="investigate()">Investigate</button>
      </div>
    </div>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const symptomsInput = document.getElementById('symptoms');
    const serviceSelect = document.getElementById('service');
    const sendBtn = document.getElementById('send-btn');

    symptomsInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !sendBtn.disabled) investigate();
    });

    function clearWelcome() {
      const welcome = chat.querySelector('.welcome');
      if (welcome) welcome.remove();
    }

    function addUserMessage(service, symptoms) {
      clearWelcome();
      const div = document.createElement('div');
      div.className = 'message user';
      div.innerHTML = `<div class="bubble"><strong>[${service}]</strong> ${escapeHtml(symptoms)}</div>`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function addLoading() {
      clearWelcome();
      const div = document.createElement('div');
      div.className = 'message agent';
      div.id = 'loading-msg';
      div.innerHTML = `
        <div class="bubble">
          <div class="label">Agent</div>
          <div class="loading">
            <div class="spinner"></div>
            <span>Investigating...</span>
          </div>
        </div>`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function removeLoading() {
      const el = document.getElementById('loading-msg');
      if (el) el.remove();
    }

    function addAgentResponse(data) {
      removeLoading();
      const div = document.createElement('div');
      div.className = 'message agent';

      const confClass = `confidence-${data.confidence || 'low'}`;

      let similarHtml = '';
      if (data.similar_incidents && data.similar_incidents.length > 0) {
        similarHtml = `
          <div class="section">
            <div class="section-title">Similar Past Incidents</div>
            <div class="similar-list">
              ${data.similar_incidents.slice(0, 3).map(inc => `
                <div class="similar-item">
                  <div class="sim-service">${escapeHtml(inc.service)}</div>
                  <div class="sim-symptoms">${escapeHtml(inc.symptoms.substring(0, 100))}...</div>
                  ${inc.fix ? `<div class="sim-fix">Fix: ${escapeHtml(inc.fix.substring(0, 100))}</div>` : ''}
                  <div class="sim-distance">Similarity: ${((1 - inc.distance) * 100).toFixed(1)}%</div>
                </div>
              `).join('')}
            </div>
          </div>`;
      }

      div.innerHTML = `
        <div class="bubble">
          <div class="label">Agent</div>
          <div class="diagnosis">
            <div class="section">
              <div class="section-title">Root Cause</div>
              <div class="section-content">${escapeHtml(data.proposed_root_cause || 'Unable to determine')}</div>
            </div>
            <div class="section">
              <div class="section-title">Proposed Fix</div>
              <div class="section-content">${escapeHtml(data.proposed_fix || 'Manual investigation required')}</div>
            </div>
            <div class="section">
              <div class="section-title">Confidence</div>
              <div class="section-content"><span class="confidence-badge ${confClass}">${data.confidence || 'unknown'}</span></div>
            </div>
            ${similarHtml}
            <div class="section">
              <div class="section-title">Reasoning</div>
              <div class="section-content" style="color: #a1a1aa; font-size: 13px;">${escapeHtml(data.reasoning || '')}</div>
            </div>
            <div class="memory-badge ${data.memory_updated ? 'updated' : ''}">
              ${data.memory_updated ? '✓ Saved to memory' : '⚠ Not saved to memory'}
            </div>
          </div>
        </div>`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function addError(msg) {
      removeLoading();
      const div = document.createElement('div');
      div.className = 'message agent';
      div.innerHTML = `<div class="bubble" style="border-color: #450a0a;">
        <div class="label">Error</div>
        <div style="color: #f87171;">${escapeHtml(msg)}</div>
      </div>`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function investigate() {
      const service = serviceSelect.value;
      const symptoms = symptomsInput.value.trim();
      if (!symptoms) return;

      addUserMessage(service, symptoms);
      symptomsInput.value = '';
      sendBtn.disabled = true;
      addLoading();

      try {
        const res = await fetch('/api/investigate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ service, symptoms }),
        });

        const data = await res.json();

        if (!res.ok) {
          addError(data.error || 'Something went wrong');
        } else {
          addAgentResponse(data);
        }
      } catch (err) {
        addError('Failed to connect to agent: ' + err.message);
      } finally {
        sendBtn.disabled = false;
        symptomsInput.focus();
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
  </script>
</body>
</html>
