<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Incident History — Memory Agent</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1117;
      color: #e4e4e7;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 16px 24px;
      border-bottom: 1px solid #27272a;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header .logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .header h1 { font-size: 18px; font-weight: 600; }

    .header .nav {
      display: flex;
      gap: 4px;
      margin-left: 24px;
    }

    .header .nav-link {
      color: #71717a;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
    }

    .header .nav-link:hover { color: #e4e4e7; background: #1c1c22; }
    .header .nav-link.active { color: #e4e4e7; background: #27272a; }

    .header .status {
      margin-left: auto;
      font-size: 12px;
      color: #71717a;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header .status .dot {
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
    }

    /* Content */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }

    .content-inner {
      max-width: 900px;
      margin: 0 auto;
    }

    .page-title {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .page-subtitle {
      font-size: 14px;
      color: #71717a;
      margin-bottom: 24px;
    }

    /* Filters */
    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: #1c1c22;
      border: 1px solid #27272a;
      color: #a1a1aa;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover { border-color: #6366f1; color: #e4e4e7; }
    .filter-btn.active { background: #6366f1; border-color: #6366f1; color: white; }

    /* Table */
    .incidents-table {
      width: 100%;
      border-collapse: collapse;
    }

    .incidents-table th {
      text-align: left;
      padding: 10px 12px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #71717a;
      border-bottom: 1px solid #27272a;
    }

    .incidents-table td {
      padding: 12px;
      border-bottom: 1px solid #1c1c22;
      font-size: 13px;
      vertical-align: top;
    }

    .incidents-table tr:hover td {
      background: #1c1c22;
    }

    .service-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      background: #1e1b4b;
      color: #a5b4fc;
    }

    .service-tag.auth-service { background: #1e1b4b; color: #a5b4fc; }
    .service-tag.payments-api { background: #052e16; color: #86efac; }
    .service-tag.search-indexer { background: #422006; color: #fdba74; }
    .service-tag.notification-worker { background: #3b0764; color: #d8b4fe; }
    .service-tag.api-gateway { background: #083344; color: #67e8f9; }

    .status-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }

    .status-badge.resolved { background: #052e16; color: #4ade80; }
    .status-badge.open { background: #422006; color: #fb923c; }

    .symptoms-text {
      color: #a1a1aa;
      max-width: 250px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .root-cause-text {
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .time-text {
      color: #52525b;
      font-size: 12px;
      white-space: nowrap;
    }

    /* Expanded row */
    .expanded-row td {
      background: #1c1c22;
      padding: 16px 20px;
    }

    .expanded-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .expanded-section {
      margin-bottom: 8px;
    }

    .expanded-section .label {
      font-size: 11px;
      color: #71717a;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .expanded-section .value {
      font-size: 13px;
      line-height: 1.5;
      color: #e4e4e7;
    }

    /* Loading */
    .loading-state {
      text-align: center;
      padding: 40px;
      color: #71717a;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #52525b;
    }

    .empty-state h3 {
      font-size: 16px;
      color: #71717a;
      margin-bottom: 8px;
    }

    /* Stats bar */
    .stats-bar {
      display: flex;
      gap: 24px;
      margin-bottom: 24px;
      padding: 16px 20px;
      background: #1c1c22;
      border: 1px solid #27272a;
      border-radius: 10px;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 600;
    }

    .stat-label {
      font-size: 11px;
      color: #71717a;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🧠</div>
    <h1>Incident Memory Agent</h1>
    <nav class="nav">
      <a href="/" class="nav-link">Investigate</a>
      <a href="/pending" class="nav-link">New Incidents</a>
      <a href="/history" class="nav-link active">History</a>
    </nav>
    <div class="status">
      <div class="dot"></div>
      <span>Connected</span>
    </div>
  </div>

  <div class="content">
    <div class="content-inner">
      <h2 class="page-title">Incident History</h2>
      <p class="page-subtitle">All past incidents stored in memory</p>

      <div class="refresh-bar" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <span class="count-label"><strong id="stat-total-label">—</strong> incidents in memory</span>
        <button onclick="resetBugs()" style="
          background: #dc2626; border: none; color: white; padding: 8px 14px;
          border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer;
        ">🔄 Reset All Bugs</button>
      </div>

      <!-- Bug Control Panel -->
      <div id="bugPanel" style="
        background: #1c1c22; border: 1px solid #27272a; border-radius: 10px;
        padding: 16px 20px; margin-bottom: 24px;
      ">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
          <span style="font-size:13px; font-weight:600; color:#e4e4e7;">Bug Control Panel</span>
          <button onclick="loadBugFlags()" style="background:none; border:none; color:#71717a; font-size:11px; cursor:pointer;">↻ Refresh</button>
        </div>
        <div id="bugFlags" style="display:grid; gap:10px;">
          <div style="color:#71717a; font-size:12px;">Loading...</div>
        </div>
      </div>

      <div class="stats-bar" id="stats-bar">
        <div class="stat-item">
          <span class="stat-value" id="stat-total">—</span>
          <span class="stat-label">Total Incidents</span>
        </div>
        <div class="stat-item">
          <span class="stat-value" id="stat-resolved" style="color: #4ade80;">—</span>
          <span class="stat-label">Resolved</span>
        </div>
        <div class="stat-item">
          <span class="stat-value" id="stat-healed" style="color: #a5b4fc;">—</span>
          <span class="stat-label">Auto-Resolved</span>
        </div>
        <div class="stat-item">
          <span class="stat-value" id="stat-open" style="color: #fb923c;">—</span>
          <span class="stat-label">Open</span>
        </div>
        <div class="stat-item">
          <span class="stat-value" id="stat-services">—</span>
          <span class="stat-label">Services</span>
        </div>
      </div>

      <div class="filters" id="filters">
        <button class="filter-btn active" data-filter="all">All</button>
      </div>

      <div id="table-container">
        <div class="loading-state">Loading incidents...</div>
      </div>
    </div>
  </div>

  <script>
    let allIncidents = [];
    let activeFilter = 'all';

    async function loadIncidents() {
      try {
        const res = await fetch('/api/incidents');
        if (!res.ok) throw new Error('Failed to load');
        allIncidents = await res.json();
        updateStats();
        buildFilters();
        renderTable();
      } catch (err) {
        document.getElementById('table-container').innerHTML =
          `<div class="empty-state"><h3>Could not load incidents</h3><p>${err.message}</p></div>`;
      }
    }

    function updateStats() {
      document.getElementById('stat-total').textContent = allIncidents.length;
      document.getElementById('stat-resolved').textContent = allIncidents.filter(i => i.resolved).length;
      document.getElementById('stat-healed').textContent = allIncidents.filter(i => i.status === 'auto_healed').length;
      document.getElementById('stat-open').textContent = allIncidents.filter(i => !i.resolved).length;
      const services = new Set(allIncidents.map(i => i.service));
      document.getElementById('stat-services').textContent = services.size;
    }

    function buildFilters() {
      const services = [...new Set(allIncidents.map(i => i.service))].sort();
      const container = document.getElementById('filters');
      container.innerHTML = `
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="open">🟠 Open</button>
        <button class="filter-btn" data-filter="resolved">🟢 Resolved</button>
        <span style="color:#3f3f46; margin: 0 8px;">|</span>
      `;
      services.forEach(s => {
        container.innerHTML += `<button class="filter-btn" data-filter="service:${s}">${s}</button>`;
      });

      container.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          container.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          activeFilter = btn.dataset.filter;
          renderTable();
        });
      });
    }

    function renderTable() {
      let filtered;
      if (activeFilter === 'all') {
        filtered = allIncidents;
      } else if (activeFilter === 'open') {
        filtered = allIncidents.filter(i => !i.resolved);
      } else if (activeFilter === 'resolved') {
        filtered = allIncidents.filter(i => i.resolved);
      } else if (activeFilter.startsWith('service:')) {
        filtered = allIncidents.filter(i => i.service === activeFilter.replace('service:', ''));
      } else {
        filtered = allIncidents;
      }

      if (filtered.length === 0) {
        document.getElementById('table-container').innerHTML =
          `<div class="empty-state"><h3>No incidents found</h3><p>Run an investigation to build memory.</p></div>`;
        return;
      }

      let html = `
        <table class="incidents-table">
          <thead>
            <tr>
              <th>Time</th>
              <th>Service</th>
              <th>Symptoms</th>
              <th>Root Cause</th>
              <th>Resolution</th>
            </tr>
          </thead>
          <tbody>`;

      filtered.forEach(inc => {
        const time = inc.created_at ? formatTime(inc.created_at) : '—';
        const serviceClass = inc.service.replace(/[^a-z-]/g, '');

        let resolution, resStyle;
        if (inc.status === 'auto_healed') {
          resolution = 'Auto-Resolved';
          resStyle = 'background: #1e1b4b; color: #a5b4fc;';
        } else if (inc.resolved) {
          resolution = 'Manually Resolved';
          resStyle = 'background: #052e16; color: #4ade80;';
        } else {
          resolution = 'Open';
          resStyle = 'background: #422006; color: #fb923c;';
        }

        html += `
          <tr class="incident-row" data-id="${inc.id}" onclick="toggleRow(this, '${inc.id}')">
            <td class="time-text">${time}</td>
            <td><span class="service-tag ${serviceClass}">${escapeHtml(inc.service)}</span></td>
            <td class="symptoms-text" title="${escapeHtml(inc.symptoms)}">${escapeHtml(inc.symptoms)}</td>
            <td class="root-cause-text" title="${escapeHtml(inc.root_cause || '')}">${escapeHtml(inc.root_cause || '—')}</td>
            <td><span class="status-badge" style="${resStyle}">${resolution}</span></td>
          </tr>`;
      });

      html += `</tbody></table>`;
      document.getElementById('table-container').innerHTML = html;
    }

    function toggleRow(rowEl, id) {
      const existing = rowEl.nextElementSibling;
      if (existing && existing.classList.contains('expanded-row')) {
        existing.remove();
        return;
      }

      // Remove any other expanded rows
      document.querySelectorAll('.expanded-row').forEach(r => r.remove());

      const inc = allIncidents.find(i => i.id === id);
      if (!inc) return;

      const expandedRow = document.createElement('tr');
      expandedRow.className = 'expanded-row';
      expandedRow.innerHTML = `
        <td colspan="5">
          <div class="expanded-content">
            <div class="expanded-section">
              <div class="label">Full Symptoms</div>
              <div class="value">${escapeHtml(inc.symptoms)}</div>
            </div>
            <div class="expanded-section">
              <div class="label">Root Cause</div>
              <div class="value">${escapeHtml(inc.root_cause || 'Not determined')}</div>
            </div>
            <div class="expanded-section" style="grid-column: 1 / -1;">
              <div class="label">Fix</div>
              ${!inc.resolved ? `
                <textarea id="fix-edit-${inc.id}" style="
                  width: 100%; min-height: 60px; padding: 10px; border-radius: 6px;
                  background: #0f1117; border: 1px solid #3f3f46; color: #e4e4e7;
                  font-size: 13px; resize: vertical; font-family: inherit;
                ">${escapeHtml(inc.fix || '')}</textarea>
              ` : `
                <div class="value">${escapeHtml(inc.fix || 'Not determined')}</div>
              `}
            </div>
            <div class="expanded-section">
              <div class="label">Incident ID</div>
              <div class="value" style="font-family: monospace; font-size: 12px; color: #71717a;">${inc.id}</div>
            </div>
            ${!inc.resolved ? `
            <div class="expanded-section" style="margin-top: 12px;">
              <button onclick="manualResolve('${inc.id}')" style="
                background: #059669; color: white; border: none; padding: 8px 16px;
                border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer;
              ">✓ Mark as Manually Resolved</button>
            </div>` : `
            <div class="expanded-section" style="margin-top: 12px;">
              <span style="color: #4ade80; font-size: 13px;">✓ This incident is resolved</span>
            </div>`}
          </div>
        </td>`;
      rowEl.after(expandedRow);
    }

    function formatTime(iso) {
      const d = new Date(iso);
      const now = new Date();
      const diffMs = now - d;
      const diffMins = Math.floor(diffMs / 60000);
      const diffHours = Math.floor(diffMs / 3600000);
      const diffDays = Math.floor(diffMs / 86400000);

      if (diffMins < 1) return 'Just now';
      if (diffMins < 60) return `${diffMins}m ago`;
      if (diffHours < 24) return `${diffHours}h ago`;
      if (diffDays < 7) return `${diffDays}d ago`;
      return d.toLocaleDateString();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    async function manualResolve(id) {
      const fixText = document.getElementById('fix-edit-' + id)?.value || '';
      const btn = event.target;
      btn.disabled = true;
      btn.textContent = 'Resolving...';

      try {
        const res = await fetch(`/api/incidents/${id}/resolve`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fix: fixText })
        });
        if (res.ok) {
          const inc = allIncidents.find(i => i.id === id);
          if (inc) {
            inc.resolved = true;
            inc.status = 'confirmed';
            inc.fix = fixText;
          }
          updateStats();
          renderTable();
        } else {
          const data = await res.json();
          btn.textContent = `Failed: ${data.error || 'unknown'}`;
          btn.disabled = false;
        }
      } catch (err) {
        btn.textContent = `Error: ${err.message}`;
        btn.disabled = false;
      }
    }

    async function resetBugs() {
      if (!confirm('This will re-inject all bugs into the demo app. Continue?')) return;
      try {
        const res = await fetch('/api/reset-bugs', { method: 'POST' });
        const data = await res.json();
        if (data.success) {
          alert('All bugs re-injected. The demo app is buggy again.');
          loadBugFlags();
        } else {
          alert('Failed: ' + (data.error || 'unknown'));
        }
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }

    async function loadBugFlags() {
      try {
        const res = await fetch('/api/heal-flags');
        const data = await res.json();
        if (!data.success) return;
        const container = document.getElementById('bugFlags');
        const shortNames = {
          'login_password_check': 'Login — wrong password comparison',
          'search_column_name': 'Search — wrong DB column name',
          'checkout_total_calc': 'Checkout — wrong total formula',
          'order_creation_column': 'Order — wrong INSERT column',
        };
        container.innerHTML = data.flags.map(f => {
          const label = shortNames[f.bug_id] || f.bug_id;
          return `
          <div style="display:flex; align-items:center; justify-content:space-between; padding:10px 12px; background:#0f1117; border-radius:6px; border:1px solid #27272a;">
            <span style="font-size:13px; color:#e4e4e7;">${label}</span>
            <div style="display:flex; align-items:center; gap:8px;">
              <span style="font-size:11px; padding:3px 8px; border-radius:4px; font-weight:600;
                ${f.healed ? 'background:#052e16; color:#4ade80;' : 'background:#422006; color:#fb923c;'}">
                ${f.healed ? 'Healed' : 'Active'}
              </span>
              <button onclick="toggleBug('${f.bug_id}', ${f.healed})" style="
                background: ${f.healed ? '#dc2626' : '#059669'}; border: none; color: white;
                padding: 5px 10px; border-radius: 4px; font-size: 11px; font-weight: 600; cursor: pointer;
              ">${f.healed ? 'Re-inject' : 'Heal'}</button>
            </div>
          </div>`;
        }).join('');
      } catch (err) {
        console.error('Failed to load bug flags:', err);
      }
    }

    async function toggleBug(bugId, currentlyHealed) {
      const newState = !currentlyHealed;
      try {
        const res = await fetch('/api/toggle-bug', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ bug_id: bugId, healed: newState })
        });
        const data = await res.json();
        if (data.success) {
          loadBugFlags();
        } else {
          alert('Failed: ' + (data.error || 'unknown'));
        }
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }

    // Load bug flags on page load
    loadBugFlags();

    loadIncidents();
  </script>
</body>
</html>
